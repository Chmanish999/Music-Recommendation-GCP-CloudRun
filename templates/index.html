<!DOCTYPE html>
<html>
<head>
    <title>Music Recommendation App</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }
        .container {
            background: white;
            width: 420px;
            margin: 70px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }
        button {
            padding: 10px;
            width: 95%;
            background: #2874a6;
            color: white;
            border: none;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Music Genre Recommendation App</h2>

    <form action="/predict" method="post">
        <input type="number" name="age" placeholder="Enter Age" required>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select>

        <button type="submit">Recommend Genre</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>
</div>

</body>
</html>
