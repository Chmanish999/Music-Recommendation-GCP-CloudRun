<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered music genre recommendation based on your age and gender">
    <title>Music Genre Recommender</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group select option {
            background: #1e1b3a;
            color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }

        .form-group input[type="number"] {
            -moz-appearance: textfield;
        }

        .form-group input[type="number"]::-webkit-outer-spin-button,
        .form-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .gender-wrapper {
            position: relative;
        }

        .gender-wrapper::after {
            content: "▾";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            pointer-events: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            margin-top: 8px;
            position: relative;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            position: absolute;
            left: 50%;
            top: 50%;
            margin-left: -10px;
            margin-top: -10px;
        }

        .btn.loading .btn-text {
            visibility: hidden;
        }

        .btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            animation: fadeIn 0.35s ease;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #86efac;
        }

        .result.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .header .icon {
                font-size: 40px;
            }

            .header h1 {
                font-size: 20px;
            }

            .btn {
                padding: 13px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="icon">🎵</div>
            <h1>Music Recommender</h1>
            <p>Discover your next favorite genre</p>
        </div>

        <form id="predict-form" action="/predict" method="post" autocomplete="off">
            <div class="form-group">
                <label for="age">Your Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="e.g. 25"
                    min="1"
                    max="120"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <div class="gender-wrapper">
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span class="btn-text">Recommend Genre</span>
                <span class="spinner"></span>
            </button>
        </form>

        {% if prediction_text %}
        <div
            class="result show
            {% if prediction_text.startswith('Error:') %}error{% else %}success{% endif %}"
            id="result"
        >
            {{ prediction_text }}
        </div>
        {% else %}
        <div class="result" id="result"></div>
        {% endif %}
    </div>

    <div class="footer">
        powered by scikit-learn &middot; deployed on Google Cloud Run
    </div>

    <script>
        const form = document.getElementById('predict-form');
        const btn = document.getElementById('submit-btn');
        const result = document.getElementById('result');

        form.addEventListener('submit', function() {
            btn.classList.add('loading');
            btn.disabled = true;
        });

        window.addEventListener('pageshow', function() {
            btn.classList.remove('loading');
            btn.disabled = false;

            if (result && result.textContent.trim() !== '') {
                if (result.textContent.startsWith('Error:')) {
                    result.className = 'result show error';
                } else {
                    result.className = 'result show success';
                }
            }
        });
    </script>

</body>
</html>
